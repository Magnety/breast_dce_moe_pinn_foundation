seed: 2026

data:
  manifest_path: /home/ubuntu/liuyiyao/breast_pcr/src/breast_mri_ai/breast_dce_moe_pinn_foundation/configs/foundation_manifest_full_v4.csv
  dataset_root: /home/ubuntu/liuyiyao1/multimodal_dataset
  # 预训练默认使用 manifest 中的全部样本（不按 split / dataset 过滤）。
  # 如果想限制到某些 dataset，可以填 include_datasets，例如 [ispy2, duke]。
  # 如果想换回旧行为，加上 train_split: train 即可。
  train_split: null
  modalities: [DCE, T1, T2, DWI, ADC, derived]
  target_shape: [64, 128, 128]
  # 每个 sample 最多保留多少个 volume。把它压到实际数据的 p75 而不是奢侈值，
  # 直接降低 worker 端 IO/IPC 量：batch tensor 大小 ∝ V，wait 时间也大致 ∝ V。
  # 数据实测中位数若是 4-6，把它设到 6-8；若数据基本都有 12+，再调高。
  max_volumes: 8
  normalize: true
  cache:
    enabled: true
    dir: /home/ubuntu/liuyiyao1/multimodal_dataset/.breast_dce_moe_pinn_cache
    after_normalize: true
    # 用 mmap 读取已经建好的 cache：操作系统按 page lazy-load，
    # page cache 命中时近似 memcpy 速度。不带 mmap 时每个 4MB npy 都要
    # full-read+copy 到用户态，是当前 wait 的主要来源。
    npy_mmap_mode: "r"
  include_datasets: []
  exclude_datasets: []
  augmentation:
    enabled: true
    flip_prob: 0.5
    noise_prob: 0.2
    noise_std: 0.03
    scale_prob: 0.3
    scale_range: [0.9, 1.1]
    shift_prob: 0.3
    shift_range: [-0.05, 0.05]

model:
  image_size: [64, 128, 128]
  patch_size: [4, 16, 16]
  in_channels: 1
  # 提高 patch 容积和通道宽度，提升单 step 的 GPU 工作量。
  embed_dim: 512
  num_heads: 8
  encoder_depth: 8
  temporal_depth: 6
  temporal_patch_chunk_size: 128
  lesion_queries: 24
  moe_top_k: 2
  moe_num_experts: 12
  encoder_mlp_ratio: 8.0
  temporal_mlp_ratio: 6.0
  moe_hidden_ratio: 4.0
  moe_gate_hidden_ratio: 2.0
  lesion_pool_ratio: 2.0
  fusion_hidden_ratio: 2.0
  pinn_hidden_dim: 256
  subtype_classes: 4
  mask_ratio: 0.4
  channels_last_3d: true

training:
  epochs: 10000
  # 默认 batch_size=8：诊断阶段降到 2 只能证明 dataloader 压力小，
  # 但 5090 在 batch_size=2 时 workload 太碎，本来就难跑到高功耗。
  # 真正吞吐对比要在 batch_size=8/16 下做（用 samples/sec、volumes/sec、
  # step time 判断，而不是只看 GPU 功耗）。
  batch_size: 8
  # CPU augment 已搬到 GPU，worker 只负责 mmap+crop+normalize；
  # 8 worker 已经够喂满 GPU；继续加 worker 反而会让 IPC 共享内存竞争变重。
  num_workers: 8
  # batch tensor 在 V=8 之后约 0.25 GB / batch；prefetch=2 单 rank 缓冲 ~4 GB。
  prefetch_factor: 2
  persistent_workers: true
  # pin_memory：恢复 true（参考实现也用），加速 H2D。如果你的 ulimit -l 没扩，
  # 启动时会报 ``CUDA error: invalid argument``，这时 ulimit -l unlimited 后再试。
  pin_memory: true
  # sample-packed cache 命中后，更适合让多个 worker 并行拉 sample，
  # 再在 CUDA 侧组 batch，而不是单个 worker 串行构完整批。
  dataset_batch_fetch: false
  cuda_prefetch: true
  # 多卡下这里改回 FIFO：配合 volume-balanced sampler，保住“每个全局 step
  # 各 rank 负载已配平”的顺序，不再让 worker 返回顺序把它打散。
  in_order: true
  # sample-packed cache 已经把每个 sample 的磁盘访问收敛到一次 open，
  # 这里改为默认延迟到 CUDA 侧组 batch，保留 worker 间的 sample 并行度。
  defer_cpu_batch_stack: true
  # drop_last=true 让 DDP 各 rank 拿到完全等量的 batch，避免最后一个不完整
  # batch 在 sampler 不均衡时引入 rank straggler。
  # 多卡默认开启：按 real volume 数均衡 rank 负载，优先解决
  # “一张卡还在忙、其余卡已经在等”的 DDP straggler。
  volume_balanced_sampling: true
  drop_last: true
  multiprocessing_context: spawn
  # timing_probe 会在 fwd/bwd/opt 后调 ``torch.cuda.synchronize``，会拖慢
  # 真实训练 5-10%。诊断时再开 ``--timing-probe``（如果 main.py 支持）或
  # 直接把这一项改成 true。
  timing_probe: false
  log_interval: 100
  progress_bar: true
  eval_interval: 0
  checkpoint_interval: 0
  save_checkpoints: true
  save_last_checkpoint: true
  save_best_checkpoint: true
  lr: 0.0001
  weight_decay: 0.0001
  scheduler:
    name: step
    step_size: 40
    gamma: 0.995
  grad_clip_norm: 1.0
  amp: true
  optimizer_foreach: true
  optimizer_fused: true
  resume_path:

performance:
  cpu_num_threads: 1
  cudnn_benchmark: true
  allow_tf32: true
  # DDP: 关闭 find_unused_parameters，开 static_graph。
  # 配合模型 forward 末尾的 _param_anchor()（0 系数全参数 sum），
  # 保证每步 used-set 完全一致，避免 NCCL all_reduce 与 reducer 卡死。
  ddp_static_graph: true
  ddp_find_unused_parameters: false
  ddp_gradient_as_bucket_view: true
  torch_compile: false
  torch_compile_mode: max-autotune-no-cudagraphs

loss:
  lambda_mae: 1.0
  lambda_phase_order: 0.1
  lambda_pinn: 1.0
  lambda_moe_balance: 0.01

visualization:
  enabled: true
  interval: 100
  random_preview_sample: true
  preview_indices: []
  preview_batch_size: 1
  max_visualized_volumes: 4

output:
  root: outputs/breast_dce_moe_pinn/pretrain
