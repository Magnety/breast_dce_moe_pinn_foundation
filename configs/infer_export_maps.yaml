data:
  manifest_path: /home/ubuntu/liuyiyao/breast_pcr/src/breast_mri_ai/breast_dce_moe_pinn_foundation/configs/foundation_manifest_full_v4.csv
  dataset_root: /home/ubuntu/liuyiyao1/multimodal_dataset
  # 想复用微调时确定的 by_ratio / by_dataset 划分时，把同样的 split_strategy
  # 写在这里即可——Inferencer 会取 test 子集（没有 test 时回退到 val/train）。
  split_strategy:
    mode: manifest
    train_split: train
    val_split: val
    test_split: test
  # 兼容字段：split 直接写一个值时表示按 manifest 列过滤；留空表示全部样本。
  split:
  include_datasets: []
  exclude_datasets: []
  modalities: [DCE, T1, T2, DWI, ADC, derived]
  target_shape: [64, 128, 128]
  max_volumes: 12
  normalize: true
  cache:
    enabled: true
    dir: /home/ubuntu/liuyiyao1/multimodal_dataset/.breast_dce_moe_pinn_cache
    after_normalize: true
    npy_mmap_mode: "r"
  label_columns:
    pCR: pCR
    HER2: HER2
    ER: ER
    PR: PR
    HR: HR
    molecular_subtype: molecular_subtype
    survival_time: survival_time
    survival_event: survival_event

model:
  image_size: [64, 128, 128]
  patch_size: [16, 16, 4]
  in_channels: 1
  embed_dim: 512
  num_heads: 8
  encoder_depth: 8
  temporal_depth: 6
  temporal_patch_chunk_size: 128
  lesion_queries: 24
  moe_top_k: 2
  moe_num_experts: 12
  encoder_mlp_ratio: 8.0
  temporal_mlp_ratio: 6.0
  moe_hidden_ratio: 4.0
  moe_gate_hidden_ratio: 2.0
  lesion_pool_ratio: 2.0
  fusion_hidden_ratio: 2.0
  pinn_hidden_dim: 256
  subtype_classes: 4
  mask_ratio: 0.4
  channels_last_3d: true

training:
  checkpoint:
  batch_size: 1
  num_workers: 0
  amp: true

performance:
  cpu_num_threads: 1
  cudnn_benchmark: true
  allow_tf32: true

inference:
  checkpoint:
  batch_size: 1
  export_attention: true
  export_hemodynamic_maps: true
  output_dir: outputs/breast_dce_moe_pinn/infer
  tsne_task: pCR
  shap_task: pCR

analysis:
  tsne_task: pCR
  shap_task: pCR
